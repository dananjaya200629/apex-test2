<!doctype html>
<html lang="en">
<head>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script src="app.js"></script>
<script src="sync.js"></script>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>APEX HOLDINGS — Cloud OMS V43</title>
<link rel="icon" href="assets/apex-logo.png"/>
<link rel="stylesheet" href="styles.css"/>
</head>
<body>
<div id="loginScreen" class="login-screen"></div>
<div class="app-shell" id="appShell" style="display:none">
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <img src="assets/apex-logo.png" alt="APEX HOLDINGS"/>
      <div class="brand-copy"><div class="brand-name">APEX HOLDINGS</div><div class="brand-sub">DREAM • BUILD • SUCCEED</div></div>
    </div>
    <div class="side-scroll">
      <div class="section-label">MAIN</div>
      <button class="nav-item dashboard-role-only" data-route="dashboard"><span class="ico">◫</span><span>Dashboard</span></button>
      <div class="nav-group staff-hide" data-group="stock"><button class="nav-item group-toggle"><span class="ico">▣</span><span>Stock</span><span class="chev">›</span></button><div class="submenu"><button data-route="stock-list">Stock List</button><button data-route="stock-purchase" class="company-stock-request">Request Stock</button><button data-route="stock-requests" class="owner-only">Company Stock Requests</button><button data-route="product-tools" class="admin-owner">Product Create &amp; Transfer</button></div></div>
      <div class="nav-group" data-group="lead"><button class="nav-item group-toggle"><span class="ico">◉</span><span>Lead</span><span class="chev">›</span></button><div class="submenu"><button data-route="import-lead">Import Lead</button><button data-route="lead-list">Lead List</button></div></div>
      <div class="nav-group" data-group="orders"><button class="nav-item group-toggle"><span class="ico">▤</span><span>Orders</span><span class="chev">›</span></button><div class="submenu"><button data-route="new-order">New Order</button><button data-route="pending-orders">Pending Order</button><button data-route="search-orders">Search Order</button></div></div>
      <div class="nav-group" data-group="shipping"><button class="nav-item group-toggle"><span class="ico">➜</span><span>Shipping</span><span class="chev">›</span></button><div class="submenu"><button data-route="ship">Ship</button><button data-route="shipped-list">Shipped List</button></div></div>
      <div class="nav-group" data-group="return"><button class="nav-item group-toggle"><span class="ico">↩</span><span>Return</span><span class="chev">›</span></button><div class="submenu"><button data-route="add-return">Add Return</button><button data-route="returned-list">Returned List</button></div></div>
      <div class="nav-group admin-owner" data-group="company"><button class="nav-item group-toggle"><span class="ico">⌂</span><span>Company</span><span class="chev">›</span></button><div class="submenu"><button data-route="create-company">Create Company</button><button data-route="company-list">Company List</button><button data-route="commission">Commission</button></div></div>
      <div class="nav-group admin-owner" data-group="staff"><button class="nav-item group-toggle"><span class="ico">♙</span><span>Staff</span><span class="chev">›</span></button><div class="submenu"><button data-route="new-staff">New Staff</button><button data-route="staff-list">Staff List</button><button data-route="commission-rate">Commission Rate</button></div></div>
      <button class="nav-item" data-route="settings"><span class="ico">⚙</span><span>Settings</span></button>
      <button class="nav-item owner-only" data-route="announcement"><span class="ico">◉</span><span>Announcement</span></button>
      <div class="section-label role-label">SESSION</div>
      <div class="session-card">
        <div class="session-name" id="sessionName">Owner</div>
        <div class="session-company" id="sessionCompany">APEX HOLDINGS</div>
        <button class="logout-btn" id="logoutBtn">Log out</button>
      </div>
      </div>
  </aside>
  <main class="main">
    <header class="topbar">
      <div class="top-left"><div class="mobile-menu" id="mobileMenu">☰</div><div><div class="page-kicker" id="breadcrumb">Dashboard</div><h1 id="pageTitle">Dashboard</h1></div></div>
      <div class="top-actions"><div class="search-mini"><span>⌕</span><input id="globalSearch" placeholder="Search orders, leads, customers..."/></div><div class="profile"><div class="avatar" id="avatar">O</div><div><b id="roleText">Owner</b><small id="profileCompany">APEX HOLDINGS</small></div></div></div>
    </header>
    <div id="announcementStrip" class="announcement-strip" hidden></div>
    <div class="content" id="content"></div>
  </main>
</div>
<div id="toast" class="toast"></div>
<script src="app.js"></script>
<script src="sync.js"></script>
<script src="i18n-data.js"></script>
<script src="i18n.js"></script>
</body>
</html>
